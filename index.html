<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103659"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MYKO"><title>MYKO · My Knowledge Organizer</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png" type="image/png"><link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png"><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f2f6f8;color:#103659;font:16px system-ui,sans-serif}.card{box-sizing:border-box;width:min(540px,calc(100% - 28px));margin:20px;padding:28px;border-radius:22px;background:white;box-shadow:0 12px 40px #10365918;text-align:center}.logo{width:min(100%,350px);height:auto}h1{margin:10px 0 0}p{line-height:1.5}.action{display:block;box-sizing:border-box;width:100%;border:0;border-radius:12px;background:#103659;color:white;padding:14px 20px;font:inherit;font-weight:650;text-decoration:none;cursor:pointer;margin:12px 0}.secondary{background:#e8f0f4;color:#103659}.hint{font-size:14px;color:#506477}.hide{display:none}</style></head><body><main class="card"><img class="logo" src="./logo.png" alt="MYKO — My Knowledge Organizer"><h1>MYKO Teacher Tools</h1><p>Smart tools for everyday teaching.</p><button id="install" class="action" type="button">Install MYKO App</button><a class="action secondary" href="https://script.google.com/macros/s/AKfycbxFDPeltEmAojd71UKu954UPEAceO-PLNQYkczvRGethcCaSb4R_fgx2q8t1ulZHlII/exec" target="_blank" rel="noopener">Open Teacher Workspace ↗</a><p id="tip" class="hint" aria-live="polite">Install MYKO from this GitHub page to get the MYKO icon, not the Google Apps Script icon.</p><p class="hint">Internet is required for the teacher workspace. The installed MYKO launcher opens your existing Google Apps Script workspace.</p></main><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}let deferred=null;const b=document.getElementById('install'),tip=document.getElementById('tip');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;tip.textContent='MYKO is ready to install. Tap Install MYKO App.';});b.addEventListener('click',async()=>{if(deferred){const event=deferred;deferred=null;event.prompt();const choice=await event.userChoice;if(choice.outcome==='accepted'){tip.textContent='MYKO installation accepted. Look for the MYKO icon on your device.';}else{tip.textContent='Installation dismissed. Use your browser menu to install when ready.';}return;}if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone){tip.textContent='MYKO is already running as an installed app. Use Open Teacher Workspace to continue.';return;}const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);tip.textContent=ios?'On iPhone or iPad: open THIS GitHub MYKO page in Safari, tap Share, then Add to Home Screen. Do not add the Google Apps Script page.':'In Chrome or Edge, use the browser menu → Install page as app (or Add to Home screen). Install THIS GitHub MYKO page, not the Google Apps Script page. If the install option is missing, reload the page and try again.';});window.addEventListener('appinstalled',()=>{tip.textContent='MYKO installed. Open it from your home screen or desktop.';});</script></body></html>
