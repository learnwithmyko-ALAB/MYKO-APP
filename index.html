<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#103659"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MYKO"><title>MYKO | My Knowledge Organizer</title><link rel="manifest" href="./manifest.webmanifest?v=3"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=3"><link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png?v=3"><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f2f6f8;color:#103659;font:16px system-ui,sans-serif}.card{width:min(520px,calc(100% - 28px));margin:20px;padding:28px;border-radius:22px;background:white;box-shadow:0 12px 40px #10365918;text-align:center}.logo{width:min(100%,350px);height:auto}h1{margin:10px 0 0}p{line-height:1.5}.action{display:block;width:100%;border:0;border-radius:12px;background:#103659;color:white;padding:15px 20px;font:inherit;font-weight:650;cursor:pointer;margin:16px 0}.action:focus-visible{outline:3px solid #2e8ebd;outline-offset:3px}.hint{font-size:14px;color:#40566a;white-space:pre-line}.hidden{display:none}</style></head><body><main class="card"><img class="logo" src="./logo.png?v=3" alt="MYKO — My Knowledge Organizer"><h1>MYKO Teacher Tools</h1><p>Smart tools for everyday teaching.</p><button id="action" class="action" type="button">Install MYKO App</button><p id="tip" class="hint" role="status" aria-live="polite">Install from this GitHub Pages address to use the MYKO icon.</p><p class="hint">Internet is required for the teacher workspace. The installed MYKO app launches your existing Google Apps Script workspace.</p></main><script>
'use strict';
const WORKSPACE="https://script.google.com/macros/s/AKfycbxFDPeltEmAojd71UKu954UPEAceO-PLNQYkczvRGethcCaSb4R_fgx2q8t1ulZHlII/exec";
const button=document.getElementById('action');const tip=document.getElementById('tip');let pendingInstall=null;
const installed=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
function updateMode(){if(installed()){button.textContent='Open MYKO Teacher Workspace';tip.textContent='MYKO is installed. Tap the button to open your teacher workspace.';}else{button.textContent='Install MYKO App';}}
updateMode();window.matchMedia('(display-mode: standalone)').addEventListener?.('change',updateMode);
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();pendingInstall=event;tip.textContent='Ready to install. Tap Install MYKO App.';});
window.addEventListener('appinstalled',()=>{pendingInstall=null;tip.textContent='MYKO installed. Open it from your home screen or desktop.';updateMode();});
button.addEventListener('click',async()=>{
 if(installed()){window.open(WORKSPACE,'_blank','noopener,noreferrer');tip.textContent='If the teacher workspace did not open, allow pop-ups for this site and tap again.';return;}
 if(pendingInstall){const event=pendingInstall;pendingInstall=null;try{await event.prompt();const result=await event.userChoice;tip.textContent=result.outcome==='accepted'?'Installation accepted. Find MYKO on your home screen or desktop.':'Installation dismissed. You can try again from your browser menu.';}catch(error){tip.textContent='The browser could not display an installation prompt. Try its menu → Install page as app.';}return;}
 const ua=navigator.userAgent;const ios=/iPad|iPhone|iPod/.test(ua);const android=/Android/.test(ua);
 tip.textContent=ios?'On iPhone: open this GitHub MYKO page in Safari → Share → Add to Home Screen. Use the MYKO logo shown on this page.':android?'On Android: open this GitHub MYKO page in Chrome → ⋮ menu → Install app or Add to Home screen. If Chrome says “Create shortcut” with a G icon, cancel: you may be on the Google Apps Script page. Return to this GitHub page and reload.':'In Chrome or Edge: open the browser menu → Install page as app. If MYKO is already installed, launch it from your desktop or app list. Browser installation prompts cannot be forced.';
});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{tip.textContent='Offline launcher support is unavailable. Reload the page and try again.';}));}
</script></body></html>
